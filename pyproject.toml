[project]
name = "makespan"
version = "0.1.0"
description = "FastAPI backend for solving job shop scheduling problems with OR-Tools CP-SAT."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ortools>=9.15.6755",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.22",
]

[project.scripts]
makespan = "makespan:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["docs/"]

[tool.ruff.lint]
select = ["E", "F", "I"]  # pycodestyle errors, pyflakes, isort

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "ruff>=0.16.6",
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]
